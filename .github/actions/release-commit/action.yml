name: release commit
description: Checks out the release commit that the release workflow's prepare job made, from its git bundle (D-42).
runs:
    using: composite
    steps:
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
              name: release-commit
              path: ${{ runner.temp }}/release
        - shell: bash
          run: |
              git fetch --quiet --no-tags "$RUNNER_TEMP/release/release.bundle" HEAD
              git checkout --quiet --detach FETCH_HEAD
              git log --oneline -1
