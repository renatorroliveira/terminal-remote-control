name: ci

# Builds and unit-tests every push to main and every pull request (P-10, D-16), and the release commit when the
# release workflow calls it (D-42). The e2e, integration and AX suites need the local test hosts and the macOS
# Accessibility permission, so they stay local gates (CLAUDE.md).
on:
    push:
        branches: [main]
    pull_request:
    workflow_call:
        inputs:
            release-commit:
                description: Check the release workflow's release commit instead of the triggering one.
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    app:
        name: app (build and unit tests)
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - if: inputs.release-commit
              uses: ./.github/actions/release-commit
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - run: corepack enable pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium-headless-shell
            - run: pnpm format:check
            - run: pnpm lint
            - run: pnpm docs:ids
            - run: pnpm --filter @trc/desktop i18n:check
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build

    daemon:
        name: daemon (build and unit tests)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - if: inputs.release-commit
              uses: ./.github/actions/release-commit
            - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
              with:
                  toolchain: 1.99.1
                  components: clippy, rustfmt
            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
              with:
                  tool: cargo-nextest
            - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
              with:
                  version: 0.17.1
            - run: sudo apt-get update && sudo apt-get install -y minisign
            - run: tools/fetch-libghostty.sh
            - run: cargo fmt --all --check
            - run: cargo clippy --locked --workspace --all-targets -- -D warnings
            - run: cargo nextest run --locked --workspace
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
            - run: corepack enable pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm notices:check
            - run: pnpm gen:check
