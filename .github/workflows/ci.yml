name: ci

# E1 runs CI only on manual dispatch (P-10, D-16). The local gates are pnpm check, test:integration and test:e2e.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check-macos:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - run: corepack enable pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install chromium-headless-shell
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.99.1
                  components: clippy, rustfmt
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest
            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1
            - run: brew install minisign
            - run: tools/fetch-libghostty.sh
            - run: pnpm check
            - run: pnpm test:e2e

    daemon-linux:
        strategy:
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v5
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.99.1
                  components: clippy, rustfmt
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest
            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.1
            - run: sudo apt-get install -y minisign
            - run: tools/fetch-libghostty.sh
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo nextest run --workspace
