[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
rustix = { version = "1.1.6", features = ["event", "fs", "net", "pipe", "process", "pty", "termios"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros", "process", "io-std"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
