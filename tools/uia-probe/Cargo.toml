[package]
name = "uia-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Reads what Windows UI Automation reports for an app's focused element, for pnpm test:ax:win (D-69)"

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }
