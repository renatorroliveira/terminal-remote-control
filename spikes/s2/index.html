<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>S2 ATS spike</title>
        <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
        <link rel="stylesheet" href="spike.css" />
    </head>
    <body>
        <main>
            <h1>S2 ATS spike</h1>
            <p id="status" role="status">ready</p>
            <div class="toolbar">
                <button type="button" id="yes">Flood: yes</button>
                <button type="button" id="big">Flood: 1 GB</button>
                <button type="button" id="find">Flood: find /</button>
                <button type="button" id="stop">Stop</button>
                <button type="button" id="sample">Sample text</button>
                <button type="button" id="selectall">Select all (xterm)</button>
            </div>
            <div id="term-host" class="term-host">
                <div id="xterm"></div>
                <div id="ats"></div>
            </div>
            <button type="button" id="after">After terminal</button>
        </main>
        <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
        <script src="node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
        <script src="node_modules/@xterm/addon-unicode-graphemes/lib/addon-unicode-graphemes.js"></script>
        <script src="renderer.js"></script>
    </body>
</html>
