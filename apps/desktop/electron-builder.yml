# Packaging for Terminal Remote Control (ST-20, P-11, P-19, TECH_STACK §4.5).
appId: dev.trc.desktop
productName: Terminal Remote Control
copyright: Copyright © 2026 Renato Oliveira
directories:
    output: dist
    buildResources: resources/icons
files:
    - out/**/*
    - package.json
    - '!**/node_modules/**/*'
extraResources:
    - from: resources/bin
      to: bin
    - from: resources/daemon
      to: daemon
    - from: resources/docs
      to: docs
    - from: resources/notices
      to: notices
    - from: resources/icons/icon.png
      to: icons/icon.png
asar: true
electronFuses:
    runAsNode: false
    enableNodeOptionsEnvironmentVariable: false
    enableNodeCliInspectArguments: false
    grantFileProtocolExtraPrivileges: false
    enableEmbeddedAsarIntegrityValidation: true
    onlyLoadAppFromAsar: true
mac:
    category: public.app-category.developer-tools
    icon: resources/icons/icon.icns
    identity: '-'
    hardenedRuntime: true
    entitlements: resources/entitlements.mac.plist
    entitlementsInherit: resources/entitlements.mac.plist
    signIgnore:
        - /Contents/Resources/daemon/
    target:
        - target: dmg
          arch: [arm64, x64]
        - target: zip
          arch: [arm64, x64]
    artifactName: TRC-${version}-mac-${arch}.${ext}
dmg:
    artifactName: TRC-${version}-mac-${arch}.${ext}
# Windows (E6, P-87): a per-user installer and a zip, unsigned until E8 (SEC-04.1). The targets name no architecture,
# which would override the command line: each release runner builds its own with --x64 or --arm64, and a plain
# `pnpm dist` builds this computer's.
win:
    icon: resources/icons/icon.ico
    target:
        - nsis
        - zip
    artifactName: TRC-${version}-win-${arch}.${ext}
nsis:
    oneClick: true
    perMachine: false
    allowElevation: false
    include: resources/installer.nsh
    shortcutName: Terminal Remote Control
    createDesktopShortcut: false
    createStartMenuShortcut: true
    artifactName: TRC-${version}-win-${arch}-setup.${ext}
publish: null
