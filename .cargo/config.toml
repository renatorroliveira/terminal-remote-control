[alias]
lint = "clippy --workspace --all-targets -- -D warnings"
daemon-x64 = "zigbuild --release --target x86_64-unknown-linux-musl -p trcd"
daemon-arm64 = "zigbuild --release --target aarch64-unknown-linux-musl -p trcd"

[env]
TS_RS_EXPORT_DIR = { value = "packages/protocol/src/generated", relative = true }
TS_RS_LARGE_INT = "number"
